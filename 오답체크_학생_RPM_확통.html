<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>오답 체크</title>
<style>
  :root{ --bg:#f4f5f7; --card:#ffffff; --line:#e5e8ee; --ink:#25303f; --sub:#8b95a3; --accent:#34568b; --accent-bg:#eaf0f8; --accent-line:#b9cbe6; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; margin:0; background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 16px 120px; }
  .page-head h2{ font-size:21px; font-weight:800; margin:0 0 3px; }
  .page-head .desc{ color:var(--sub); font-size:13px; }
  .topbar{ display:flex; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:14px 0 12px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .topbar .sel{ font-size:15px; font-weight:700; flex:1; } .topbar .sel b{ color:var(--accent); }
  .foldbtn{ font-size:13px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:7px 12px; cursor:pointer; }
  .disp{ display:flex; gap:6px; margin:0 0 12px; flex-wrap:wrap; }
  .disp button{ font-size:12px; border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:8px; padding:6px 11px; cursor:pointer; }
  .disp button.on{ background:var(--accent-bg); border-color:var(--accent-line); color:var(--accent); font-weight:700; }
  .sec{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 14px 8px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .sec-h{ font-size:16px; font-weight:800; color:var(--ink); padding:2px 2px 12px; }
  .mid{ border:1px solid var(--line); border-radius:11px; margin-bottom:8px; overflow:hidden; }
  .mid-h{ display:flex; align-items:center; gap:9px; padding:13px 14px; cursor:pointer; background:#f1f4f8; }
  .mid-h .tw{ font-size:11px; color:var(--sub); width:12px; transition:transform .15s; }
  .mid-h.open .tw{ transform:rotate(90deg); }
  .mid-h .t{ font-weight:700; font-size:14.5px; flex:1; } .mid-h .c{ font-size:11.5px; color:var(--sub); }
  .mid-body{ padding:10px 12px 13px; }
  .selall{ font-size:12px; color:var(--accent); border:1px solid var(--accent-line); background:var(--accent-bg); border-radius:8px; padding:4px 10px; cursor:pointer; }
  .sub-h{ font-size:12.5px; font-weight:700; color:var(--sub); margin:12px 0 3px 2px; }
  .probs{ display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; margin-top:9px; }
  .probs.wide{ grid-template-columns:repeat(2, 1fr); }
  @media(min-width:560px){ .probs{ grid-template-columns:repeat(5,1fr);} .probs.wide{ grid-template-columns:repeat(4,1fr);} }
  .chip{ display:inline-flex; align-items:center; justify-content:center; gap:5px; border:1px solid var(--line); border-radius:10px; padding:9px 6px; font-size:14px; cursor:pointer; background:#fff; user-select:none; width:100%; }
  .chip.on{ background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:700; }
  .chip .df{ font-size:10.5px; color:#a9743a; background:#f6ede0; border-radius:5px; padding:0 5px; }
  .chip.on .df{ color:#8a5a22; background:#e6dcc7; }
  .chip .pg{ font-size:10.5px; color:var(--sub); } .chip.on .pg{ color:var(--accent); }
  .cmt-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:6px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .cmt-card .lbl{ font-size:14px; font-weight:700; margin-bottom:8px; }
  .cmt{ width:100%; min-height:72px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; resize:vertical; }
  .footer{ position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); border-top:1px solid var(--line); padding:10px 16px; }
  .footer-inner{ max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .cnt{ font-size:15px; font-weight:700; } .cnt span{ color:var(--accent); }
  .btn{ margin-left:auto; background:var(--accent); color:#fff; border:0; border-radius:11px; padding:13px 26px; font-size:16px; font-weight:800; cursor:pointer; }
  .state{ text-align:center; padding:60px 20px; color:var(--sub); }
  .done{ text-align:center; padding:56px 20px; } .done .mk{ font-size:52px; } .done h2{ font-size:20px; margin:10px 0 6px; }
  #toast{ position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:#25303f; color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; z-index:99999; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show{ opacity:1; }
</style>
</head>

var checkedIds = {};
var DISP='nd';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function showToast(m){ var t=document.getElementById('toast'); if(!t)return; t.textContent=m; t.classList.add('show'); clearTimeout(window.__tt); window.__tt=setTimeout(function(){t.classList.remove('show');},1800); }

function buildTree(groups){
  var roots=[], rmap={};
  (groups||[]).forEach(function(g){
    var u1=g.unit1||'(단원 미지정)', u2=g.unit2||'', u3=g.unit3||'';
    if(!rmap[u1]){ rmap[u1]={name:u1,kids:{},karr:[],probs:[]}; roots.push(rmap[u1]); }
    var n1=rmap[u1];
    if(!u2){ n1.probs=n1.probs.concat(g.problems||[]); return; }
    if(!n1.kids[u2]){ n1.kids[u2]={name:u2,kids:{},karr:[],probs:[]}; n1.karr.push(n1.kids[u2]); }
    var n2=n1.kids[u2];
    if(!u3){ n2.probs=n2.probs.concat(g.problems||[]); return; }
    if(!n2.kids[u3]){ n2.kids[u3]={name:u3,kids:{},karr:[],probs:[]}; n2.karr.push(n2.kids[u3]); }
    n2.kids[u3].probs=n2.kids[u3].probs.concat(g.problems||[]);
  });
  return roots;
}
function chipInner(p){
  var s=esc(p.num||'?');
  if((DISP==='nd'||DISP==='ndp') && p.diff) s+='<span class="df">'+esc(p.diff)+'</span>';
  if((DISP==='np'||DISP==='ndp') && p.page) s+='<span class="pg">p.'+esc(p.page)+'</span>';
  return s;
}
function chipHtml(p){ return '<button class="chip'+(checkedIds[p.id]?' on':'')+'" data-id="'+esc(p.id)+'">'+chipInner(p)+'</button>'; }

var midStore={};
function renderCheck(){
  var groups=DATA.groups||[];
  var roots=buildTree(groups);
  var g0=groups[0]||{};
  var label=[g0.subject,g0.book].filter(Boolean).join(' · ');
  midStore={}; var midIdx=0;

  if(!roots.length){ h+='<div class="state">문제가 없습니다.</div>'; app.innerHTML=h; footer.style.display='none'; return; }
  h+='<div class="topbar"><div class="sel">선택된 문제 <b id="selCnt">0</b>개</div><button class="foldbtn" id="foldAll">모두 펼치기</button></div>';

    +'<button data-d="np" class="'+(DISP==='np'?'on':'')+'">번호·페이지</button>'
    +'<button data-d="ndp" class="'+(DISP==='ndp'?'on':'')+'">번호·난이도·페이지</button>'
    +'</div>';
  roots.forEach(function(u1){
    h+='<div class="sec"><div class="sec-h">'+esc(u1.name)+'</div>';
    var mids=[];
    if(u1.probs && u1.probs.length) mids.push({ name:'전체 문제', probs:u1.probs, subs:[] });
    u1.karr.forEach(function(u2){ mids.push({ name:u2.name, probs:u2.probs, subs:u2.karr }); });
    mids.forEach(function(m){
      var mid='m'+(midIdx++);
      var all=[].concat(m.probs||[]); (m.subs||[]).forEach(function(u3){ all=all.concat(u3.probs||[]); });
      midStore[mid]=all.map(function(p){return p.id;});
      h+='<div class="mid"><div class="mid-h" data-mid="'+mid+'"><span class="tw">&#9654;</span><span class="t">'+esc(m.name)+'</span><span class="c">'+all.length+'문제</span></div>';
      h+='<div class="mid-body" id="body-'+mid+'" style="display:none">';
      h+='<button class="selall" data-selall="'+mid+'">이 단원 전체 선택</button>';
      var wide=(DISP==='ndp'?' wide':'');
      if(m.probs && m.probs.length) h+='<div class="probs'+wide+'">'+m.probs.map(chipHtml).join('')+'</div>';
      (m.subs||[]).forEach(function(u3){
        h+='<div class="sub-h">'+esc(u3.name)+'</div><div class="probs'+wide+'">'+(u3.probs||[]).map(chipHtml).join('')+'</div>';
      });
      h+='</div></div>';
    });
    h+='</div>';
  });
  h+='<div class="cmt-card"><div class="lbl">선생님께 전하고 싶은 말</div>'
    +'<textarea class="cmt" id="cmt" placeholder="이해 안 되는 부분, 헷갈리는 개념, 더 연습하고 싶은 유형 등 자유롭게 적어주세요. 없으면 비워두어도 괜찮아요."></textarea></div>';
  app.innerHTML=h; footer.style.display=''; updateCount();
  var _c=document.getElementById('cmt'); if(_c){ _c.value=savedComment; _c.addEventListener('input',function(){ savedComment=_c.value; }); }
  app.querySelectorAll('.disp button').forEach(function(b){ b.onclick=function(){ var c=document.getElementById('cmt'); if(c) savedComment=c.value; DISP=b.dataset.d; try{ localStorage.setItem('checkDisp',DISP);}catch(e){} renderCheck(); }; });
  app.querySelectorAll('.mid-h').forEach(function(hd){ hd.onclick=function(e){ if(e.target.closest('[data-selall]'))return; var body=document.getElementById('body-'+hd.dataset.mid); var open=body.style.display!=='none'; body.style.display=open?'none':''; hd.classList.toggle('open',!open); }; });
  app.querySelectorAll('.chip').forEach(function(c){ c.onclick=function(){ var id=c.dataset.id; if(checkedIds[id]){ delete checkedIds[id]; c.classList.remove('on'); } else { checkedIds[id]=true; c.classList.add('on'); } updateCount(); }; });
  app.querySelectorAll('[data-selall]').forEach(function(b){ b.onclick=function(){ var ids=midStore[b.dataset.selall]||[]; var allOn=ids.every(function(id){return checkedIds[id];}); ids.forEach(function(id){ if(allOn) delete checkedIds[id]; else checkedIds[id]=true; }); var body=document.getElementById('body-'+b.dataset.selall); if(body) body.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', !!checkedIds[c.dataset.id]); }); updateCount(); }; });
  var fold=document.getElementById('foldAll');
  if(fold) fold.onclick=function(){ var bodies=app.querySelectorAll('.mid-body'); var anyClosed=Array.prototype.some.call(bodies,function(b){return b.style.display==='none';}); bodies.forEach(function(b){ b.style.display=anyClosed?'':'none'; }); app.querySelectorAll('.mid-h').forEach(function(hd){ hd.classList.toggle('open', anyClosed); }); fold.textContent=anyClosed?'모두 접기':'모두 펼치기'; };
}

function submitFile(){
  var ids=Object.keys(checkedIds).filter(function(k){return checkedIds[k];});
  if(!ids.length){ if(!confirm('체크한 문제가 없습니다. 그래도 제출할까요?')) return; }
  var comment=(document.getElementById('cmt')&&document.getElementById('cmt').value||'').trim();
  var uset={};
  (DATA.groups||[]).forEach(function(g){ (g.problems||[]).forEach(function(p){ if(checkedIds[p.id]){ var k=(g.unit1||'')+'|'+(g.unit2||'')+'|'+(g.unit3||''); if(!uset[k]) uset[k]={unit1:g.unit1||'',unit2:g.unit2||'',unit3:g.unit3||'',count:0}; uset[k].count++; } }); });
  var units=[]; for(var k in uset) units.push(uset[k]);
  var now=new Date();
  var mm=String(now.getMonth()+1); if(mm.length<2) mm='0'+mm;
  var dd=String(now.getDate()); if(dd.length<2) dd='0'+dd;
  var dateStr=now.getFullYear()+mm+dd;
  var result={ type:'wrong-note-submission', version:2, studentName:DATA.studentName, suffix:DATA.suffix, submittedAt:now.toISOString(), originalCreatedAt:DATA.createdAt, checkedIds:ids, comment:comment, checkedUnits:units };
  var safeName=(DATA.studentName||'학생').replace(/[\/\\:*?"<>|]/g,'_');
  var safeSuffix=DATA.suffix?('_'+DATA.suffix.replace(/[\/\\:*?"<>|]/g,'_')):'';
  var filename='오답제출_'+safeName+safeSuffix+'_'+dateStr+'.json';
  var jsonText=JSON.stringify(result,null,2);
  var isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  try{
    if(isMobile && window.File && navigator.canShare){
      var file=new File([jsonText], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'오답 제출 - '+(DATA.studentName||''), text:filename})
          .then(function(){ showToast('공유 완료!'); })
          .catch(function(err){ if(err&&err.name==='AbortError')return; fallbackDownload(jsonText, filename, isMobile); });
        return;
      }
    }
  }catch(e){}
  fallbackDownload(jsonText, filename, isMobile);
}
function fallbackDownload(jsonText, filename, isMobile){
  try{
    var blob=new Blob([jsonText], {type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    showSendGuide(filename, isMobile);
  }catch(e){
    var fa=document.createElement('div');
    fa.style.cssText='position:fixed;inset:0;background:white;padding:20px;overflow:auto;z-index:99999;';
    fa.innerHTML='<h2 style="margin-top:0;">다운로드가 안 되는 환경입니다</h2><p>아래 내용을 모두 복사해 메모장에 붙여넣고 '+esc(filename)+' 이름으로 저장해주세요.</p><button onclick="this.parentElement.remove()" style="margin-bottom:10px;">닫기</button><textarea readonly style="width:100%;height:60vh;font-family:monospace;font-size:11px;">'+esc(jsonText)+'</textarea>';
    document.body.appendChild(fa);
  }
}
function showSendGuide(filename, isMobile){
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
  var steps=isMobile
    ? ['파일이 저장됐어요.','저장된 파일을 카카오톡으로 선생님께 전송해주세요. ("파일" 앱에서 방금 받은 파일을 찾아 공유 → 카카오톡)']
    : ['다운로드 폴더에 파일이 저장됐어요. (파일명: '+filename+')','이 파일을 카카오톡으로 선생님께 전송해주세요. (카톡 대화창에 끌어다 놓거나, 첨부 → 파일 선택)'];
  var lis=steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('');
  ov.innerHTML='<div style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px;">'
    +'<div style="font-size:20px;font-weight:800;margin-bottom:6px;">결과 파일이 저장됐어요!</div>'
    +'<div style="font-size:14px;color:#555;margin-bottom:16px;">이제 선생님께 보내기만 하면 끝이에요.</div>'
    +'<ol style="margin:0 0 18px;padding-left:22px;line-height:1.9;font-size:15px;">'+lis+'</ol>'
    +'<div style="background:#eaf0f8;border-radius:10px;padding:12px 14px;font-size:13px;color:#34568b;margin-bottom:16px;">파일을 못 찾겠으면, 카톡으로 "선생님 파일 어떻게 보내요?"라고 물어보세요!</div>'
    +'<button style="width:100%;padding:13px;border:none;border-radius:10px;background:#34568b;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">확인</button></div>';
  ov.querySelector('button').onclick=function(){ ov.remove(); };
  document.body.appendChild(ov);
}
